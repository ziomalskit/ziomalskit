name: AJ Docker image build (free GitHub runner)

# Limited to this experimental branch. Does not touch PR #8 or run on forks.
on:
  push:
    branches:
      - feat/optional-vast-docker
    paths:
      - .github/workflows/aj-docker-image.yml
      - h3/docker/**
      - h3/scripts/**
      - h3/INSTALL_ON_VAST.sh
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: aj-docker-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'ziomalskit/ziomalskit' && github.ref == 'refs/heads/feat/optional-vast-docker'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact commit (no credentials retained)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify source branch and remove unused runner SDKs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo 'Initial free disk:'
          df -h /
          # Standard public runners have only 14 GB initially available.
          # Remove SDKs unrelated to the CUDA/Linux x86_64 image build.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/share/powershell \
            /opt/hostedtoolcache /usr/local/.ghcup || true
          sudo docker system prune -af --volumes || true
          echo 'Free disk after cleanup:'
          df -h /
          free -h

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR using ephemeral workflow token
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build pinned AJ image and publish only after build success
        id: build
        shell: bash
        env:
          IMAGE: ghcr.io/ziomalskit/aj-vast
          DOCKER_BUILDKIT: '1'
          BUILDKIT_PROGRESS: plain
        run: |
          set -euo pipefail
          umask 077
          context="$(mktemp -d "$RUNNER_TEMP/aj-context.XXXXXX")"
          trap 'rm -rf "$context"' EXIT
          # Track-only archive excludes untracked weights, credentials and uploads.
          git archive "$GITHUB_SHA" h3 | tar -xf - -C "$context"
          test -f "$context/h3/docker/Dockerfile"
          tag="sha-${GITHUB_SHA:0:12}"
          echo "Building $IMAGE:$tag"
          docker buildx build \
            --platform linux/amd64 \
            --build-arg "AJ_REVISION=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --provenance=false \
            --sbom=false \
            --tag "$IMAGE:$tag" \
            --metadata-file "$RUNNER_TEMP/aj-build-metadata.json" \
            --push \
            --file "$context/h3/docker/Dockerfile" "$context"
          digest="$(jq -r '."containerimage.digest" // empty' "$RUNNER_TEMP/aj-build-metadata.json")"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo 'No trusted published digest'; exit 1; }
          docker buildx imagetools inspect "$IMAGE@$digest" >/dev/null
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
          echo '### AJ Docker image successfully built and pushed' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "\\`$IMAGE@$digest\\`" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'GPU/SageAttention kernel and Full render validation are still PENDING.' >> "$GITHUB_STEP_SUMMARY"
          echo 'GHCR defaults newly created packages to private; set package visibility to Public before anonymous Vast pulls.' >> "$GITHUB_STEP_SUMMARY"

      - name: Record free disk (even if build failed)
        if: always()
        shell: bash
        run: |
          echo '### Final runner disk space' >> "$GITHUB_STEP_SUMMARY"
          df -h / | tee -a "$GITHUB_STEP_SUMMARY"
